  <body>
    <!-- Klump's official script looks up #klump__checkout once, when it loads, so the element must already
         exist in the page. It is kept invisible: customers use our own "Continue with Pay later" button. -->
    <div aria-hidden="true" style="position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none">
      <div id="klump__checkout"></div>
    </div>
    <div id="root"></div>
    <!-- Payment scripts load AFTER the app script on purpose. Deferred scripts run in page order, so with them
         in <head> the whole site waited for Paystack and Klump to download before it could even start.
         They are still deferred, so #klump__checkout above exists when klump.js runs. -->
    <script src="https://js.paystack.co/v2/inline.js" defer></script>
    <script src="https://js.useklump.com/klump.js" defer></script>
  </body>
